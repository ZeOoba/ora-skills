name: tools tests

# Runs every tools/test_*.py on every push, to any branch.
#
# Why (2026-09-17): two skill retirements broke the tools/ suite and nothing
# noticed -- rent-comp (2026-08-05) left a realdata fixture silently SKIPPING for
# over a week, and investor-relations (2026-09-09) left main red until #60. The
# retirement check in README step 7 documents running this suite; this workflow
# enforces it.
#
# The gate logic lives in tools/run_suite.sh -- the same script README step 7
# runs locally. It fails on any failing test file AND on any skipped test (zero
# baseline); a legitimately-needed skip goes in that script's ALLOWED_SKIPS as an
# exact-count path=N entry with a reason, never by loosening the gate.
#
# The tests build synthetic fixtures and need no secrets. They are stdlib-only
# except test_package_census.py, which needs PyMuPDF (installed below) -- without
# it its 7 tests skip and trip the zero-skip gate.
# Note: claude-ci-fix.yml does NOT fire on this workflow's failures --
# GitHub never triggers workflows from check suites created by Actions itself.

on:
  push:
  workflow_dispatch:

# RUNNER TOGGLE (2026-10-17): jobs run on GitHub-hosted ubuntu-latest by default. Setting the repo
# variable CI_RUNNER=self moves them to the self-hosted runner on Gabriel's Windows laptop (labels:
# self-hosted, windows, ora-ci) -- no billed Actions minutes. Added when account billing blocked
# every hosted job. Same toggle as ZeOoba/oxford-command-center.
#   gh variable set CI_RUNNER --body self --repo ZeOoba/ora-skills
#   gh variable delete CI_RUNNER --repo ZeOoba/ora-skills
# Self-hosted differences: steps run under bash (Git Bash) instead of PowerShell; the laptop's own
# Python 3.13 is used (setup-python is skipped); apt-get is skipped (poppler/pdftotext comes from the
# laptop); and the git identity for fixture repos is set via GIT_* env vars, NEVER `git config
# --global`, which would overwrite the laptop owner's identity.

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tools-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools-tests:
    runs-on: ${{ vars.CI_RUNNER == 'self' && fromJSON('["self-hosted","windows","ora-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER != 'self'
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Run tools/test_*.py
        run: bash tools/run_suite.sh
