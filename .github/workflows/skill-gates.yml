name: skill gates

# Server-side re-run of the skill gates that previously existed only at commit time
# (tools/hooks/pre-commit, set per clone, skippable with --no-verify) or packaging time,
# plus the skill-level test suites that never ran in CI at all (2026-10-03).
#
#   skill-gates  validate_skill_frontmatter over EVERY skill dir (the hook only checks
#                staged dirs), --check-tree-hygiene, the SHARED_ROOT_DEPS declaration check,
#                and the target-markets.json version-bump rule against the PR base
#                (fork point with origin/main; on main, the pre-push tip), plus the
#                suite-continuity rule against the same base: a skill test suite present
#                no longer be discovered unless a file added under _archive/ (any depth) has
#                a path ending <skill>/<rest> or <skill>_retired-DATE/<rest> (path-only), or any
#                commit in the range has a `Suite-Removed: <path>` line. Recommended practice
#                (git mv to _archive/<skill>_retired-DATE + trailer on the removing commit) is stricter.
#   skill-tests  every gated skill test suite under tools/run_suite.sh's zero-fail /
#                zero-skip / zero-empty / no-bare-test rules, plus the packaged-layout check
#                that stages tools/ora_doc_qc.py through package_skills.package().
#
# Gate logic lives in tools/skill_ci_gates.py and tools/run_skill_suites.sh so a local run
# and CI are the same command. Note: a red check on this repo can be a GitHub Actions
# billing block (steps [], log 404) rather than a test failure -- read the check-run
# annotation first and verify locally.

on:
  push:
  workflow_dispatch:

# RUNNER TOGGLE (2026-10-17): jobs run on GitHub-hosted ubuntu-latest by default. Setting the repo
# variable CI_RUNNER=self moves them to the self-hosted runner on Gabriel's Windows laptop (labels:
# self-hosted, windows, ora-ci) -- no billed Actions minutes. Added when account billing blocked
# every hosted job. Same toggle as ZeOoba/oxford-command-center.
#   gh variable set CI_RUNNER --body self --repo ZeOoba/ora-skills
#   gh variable delete CI_RUNNER --repo ZeOoba/ora-skills
# Self-hosted differences: steps run under bash (Git Bash) instead of PowerShell; the laptop's own
# Python 3.13 is used (setup-python is skipped); apt-get is skipped (poppler/pdftotext comes from the
# laptop); and the git identity for fixture repos is set via GIT_* env vars, NEVER `git config
# --global`, which would overwrite the laptop owner's identity.

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: skill-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-gates:
    runs-on: ${{ vars.CI_RUNNER == 'self' && fromJSON('["self-hosted","windows","ora-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # target-markets base diff needs origin/main history

      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER != 'self'
        with:
          python-version: '3.13'

      - name: Frontmatter (all skills) + tree hygiene + shared-dep declarations
        run: python tools/skill_ci_gates.py frontmatter

      - name: No tracked Claude memory files (node_type memory / event_log frontmatter)
        run: python tools/skill_ci_gates.py memory-files

      - name: target-markets.json version bump vs base
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python tools/skill_ci_gates.py target-markets --base auto

      - name: Skill suites present vs base (no silent drop-out)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python tools/skill_ci_gates.py suite-continuity --base auto

  skill-tests:
    runs-on: ${{ vars.CI_RUNNER == 'self' && fromJSON('["self-hosted","windows","ora-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # lease-form-qc tests `git show 5a8a98f:...` (frozen-original checks)

      - uses: actions/setup-python@v5
        if: vars.CI_RUNNER != 'self'
        with:
          python-version: '3.13'

      # poppler-utils provides pdftotext (the QC unreadable-PDF tests expect it, as locally).
      # tesseract is deliberately NOT installed: with no OCR toolchain the no-text-layer
      # fixture must report UNREADABLE, matching the local baseline.
      - name: Install test dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          python -m pip install --disable-pip-version-check pymupdf python-docx reportlab lxml openpyxl
          echo "pdftotext: $(command -v pdftotext || echo missing)  tesseract: $(command -v tesseract || echo absent)"

      - name: Run skill test suites
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.invalid
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.invalid
        run: bash tools/run_skill_suites.sh
